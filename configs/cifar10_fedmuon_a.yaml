# Mode A: clients run SGD, server runs Muon on the aggregated pseudo-gradient.
seed: 0
device: auto
rounds: 200
local_steps: 10
batch_size: 64
n_clients: 20
num_byz: 4
participation: 1.0
data: {name: cifar10, root: data}
partition: {name: dirichlet, alpha: 0.5}
model: {name: resnet18, num_classes: 10}
client_opt: {name: sgd, lr: 0.05}
server_opt: {name: muon, lr: 0.02, momentum: 0.95, orthogonalizer: {name: ns5}, adam_lr: 0.001}
aggregator: {base: {name: mean}, pre: []}
attack: {name: none}
probes:
  - {name: evaluate, every: 5}
  - {name: spectrum, every: 10}
  - {name: amplification, every: 10}
  - {name: console, every: 5}
out_dir: results/cifar10
