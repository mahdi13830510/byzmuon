# Tune the momentum-SGD baseline (server SGD over persistent local momentum buffers) so that its clean accuracy is
# comparable to FedMuon's before attacking it. FedMuon's orthogonalized step has Frobenius norm ~1.4 per round,
# about 17x the mean client delta, so plain FedAvg-style steps (client lr 0.05, server lr 1) reach only 25% after
# 150 rounds (FedMuon: 81%); even server lr 20 without in-round momentum gives 40%. Here the clients also use
# in-round momentum 0.9 (torch SGD), which makes a 10-step delta ~4x larger, and the server lr is swept.
# 50 rounds, no attack, mean aggregation: 6 runs x ~13 min, ~40 min on a T4 x2. FedMuon reaches ~36-39% at round 50.
base: configs/cifar10_fedmuon_a.yaml
config:
  rounds: 50
  attack: {name: none}
  aggregator: {base: {name: mean}, pre: []}
  probes:
    - {name: evaluate, every: 5}
    - {name: console, every: 10}
  out_dir: results/tune_momsgd2
grid:
  server_opt,client_opt:
    - [{name: sgd, lr: 2.0},  {name: sgd, lr: 0.05, momentum: 0.9, local_momentum: 0.9}]
    - [{name: sgd, lr: 5.0},  {name: sgd, lr: 0.05, momentum: 0.9, local_momentum: 0.9}]
    - [{name: sgd, lr: 10.0}, {name: sgd, lr: 0.05, momentum: 0.9, local_momentum: 0.9}]
    - [{name: sgd, lr: 2.0},  {name: sgd, lr: 0.1, momentum: 0.9, local_momentum: 0.9}]
    - [{name: sgd, lr: 5.0},  {name: sgd, lr: 0.1, momentum: 0.9, local_momentum: 0.9}]
    - [{name: sgd, lr: 0.5, momentum: 0.9}, {name: sgd, lr: 0.05, momentum: 0.9, local_momentum: 0.9}]
seeds: [0]
