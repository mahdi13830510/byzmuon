# FedMuon vs federated momentum SGD (aggregation of local momentums, Karimireddy et al. 2021) under LIE at several z
# and under the dynamic-z attacks Min-Max / Min-Sum (Shejwalkar & Houmansadr, NDSS 2021). ResNet-18, CIFAR-10,
# 20 clients (4 Byzantine), Dirichlet 0.5, 150 rounds, ONE LOCAL EPOCH (40 steps) per round for both optimizers.
# 2 optimizers x 8 attacks x 3 aggregators = 48 runs per seed, ~2.5 h each on a T4. Several Kaggle sessions:
# attach the previous session's results.zip each time and finished runs are skipped.
# kaggle/run_all.sh replaces the momentum-SGD pair below with the best setting from the tuning sweep.
base: configs/cifar10_fedmuon_a.yaml
config:
  rounds: 150
  local_steps: 40
  probes:
    - {name: evaluate, every: 5}
    - {name: spectrum, every: 25}
    - {name: console, every: 10}
  out_dir: results/muon_vs_momentum_e1
grid:
  server_opt,client_opt:
    # FedMuon: plain local SGD, Muon with momentum 0.95 at the server
    - [{name: muon, lr: 0.02, momentum: 0.95, adam_lr: 0.001}, {name: sgd, lr: 0.05}]
    # momentum SGD: each client keeps a persistent momentum buffer and sends it; server averages (FedAvg, lr 1)
    - [{name: sgd, lr: 1.0}, {name: sgd, lr: 0.05, local_momentum: 0.9}]
  attack:
    - {name: none}
    - {name: lie, knowledge: omniscient, z: 0.25}
    - {name: lie, knowledge: omniscient, z: 0.5}
    - {name: lie, knowledge: omniscient, z: 1.0}
    - {name: lie, knowledge: omniscient, z: 2.0}
    - {name: lie, knowledge: omniscient, z: 3.0}
    - {name: minmax, knowledge: omniscient}
    - {name: minsum, knowledge: omniscient}
  aggregator.base.name: [mean, median, trimmed_mean]
seeds: [0]
