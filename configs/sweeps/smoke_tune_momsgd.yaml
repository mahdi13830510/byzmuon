# Tiny stand-in for kaggle_tune_momsgd.yaml used by tests/test_run_all.sh (synthetic data, MLP, CPU, seconds).
base: configs/smoke.yaml
config:
  rounds: 3
  attack: {name: none}
  aggregator: {base: {name: mean}, pre: []}
  probes:
    - {name: evaluate}
    - {name: console}
  out_dir: results/smoke_tune_momsgd
grid:
  server_opt,client_opt:
    - [{name: sgd, lr: 2.0}, {name: sgd, lr: 0.05, momentum: 0.9, local_momentum: 0.9}]
    - [{name: sgd, lr: 0.5, momentum: 0.9}, {name: sgd, lr: 0.05, momentum: 0.9, local_momentum: 0.9}]
seeds: [0]
